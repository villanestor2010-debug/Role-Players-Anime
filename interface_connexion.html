<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecter vous ou cree un compte</title>
    <link rel="stylesheet" href="interface_connexion.css">
</head>
<body>
    <dialog open>
        <h2>Bienvenue sur Role Players Anime</h2>
        <p>Vous etes sur le point de vous connecter a votre compte ou de cree un compte pour acceder a notre plateforme</p>
       <div class="ensemble">
            <div class="connexion">
                <h2 class="connecter_vous">Connecter vous a votre compte</h2>
                <form action="Acceuil RPA.html" class="form" method="post">
                        <div class="form">
                            <div class="pseudo"> 
                            <input id="pseudo" name="nom" type="email" placeholder="Votre pseudo ou email" required/>
                            </div>
                            <div class="password">
                                <input id="pass" name="password" type="password" placeholder="Votre mot de passe" required/>
                            </div>
                                <input type="submit" class="submit" value="se connecter"/>
                        </div>
                    </form>
            </div>
            <div class="inscription">
                <h2 class="vous_avez_pas_de_compte">Vous n'avez pas de compte ?</h2>
                <a href="interface_inscription.html" class="inscription">cree un compte</a>
            </div>
        </div>
</body>
</html>
