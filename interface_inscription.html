<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creation de compte RPA</title>
    <link rel="stylesheet" href="interface_inscription.css">
</head>
<body>
    <dialog open>
        <h2>Bienvenue sur Role Players Anime</h2>
        <p>Vous etes sur le point de cree un compte pour acceder a notre plateforme</p>
        <form action="Acceuil RPA.html" class="inscription" method="post">
        <div class="form">
            <div class="pseudo"> 
                <input id="pseudo" name="nom" type="text" placeholder="Votre pseudo" required/>
            </div>
            <div class="email">
                <input id="email" name="email" type="email" placeholder="Votre email" required/>
            </div>
            <div class="password">
                <input id="pass" name="password" type="password" placeholder="Votre mot de passe" required/>
            </div>
             <div class="password">
                <input id="pass_confirm" name="password_confirm" type="password" placeholder="Confirmer votre mot de passe" required/>
            </div>
                <input type="submit" class="submit" value="cree un compte"/>
        </div>
    </form>
</body>
</html>
